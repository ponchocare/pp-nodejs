name: CI

on:
  pull_request:
  # No push trigger: main is only checked when deploy.yml calls this workflow.
  workflow_dispatch:
  workflow_call:

# When called from deploy.yml, github.workflow is "Deploy", so this group never
# collides with (and cancels) a manual CI run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No package-lock.json in this repo (it is gitignored), so `npm ci` and
      # setup-node's npm cache cannot be used.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # tsc only runs here: it is the only type check this project has.
      - name: Build
        run: npm run build
