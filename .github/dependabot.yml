version: 2

updates:
  # Library dependencies. There is no package-lock.json in the root (it is
  # gitignored), so Dependabot only bumps the ranges in package.json.
  # example/ is not listed: it only depends on this package via file:../.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Batch dev tooling minor/patch bumps into one PR; majors stay separate.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Actions used by .github/workflows (checkout, setup-node, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
